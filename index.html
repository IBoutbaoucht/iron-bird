<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRON BIRD // C2 OVERRIDE</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #030613;
            --pcb-color: #0a1128;
            --locked: #ff003c;
            --active: #00f3ff;
            --solved: #39ff14;
            --chip-bg: #111;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            background-color: var(--bg-color);
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            font-family: 'Fira Code', monospace;
            color: var(--active);
            overflow-x: hidden;
        }

        #header {
            text-align: center; padding: 25px;
            background: rgba(3, 6, 19, 0.95);
            border-bottom: 2px solid var(--active);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
            position: fixed; width: 100%; top: 0; z-index: 100;
        }

        h1 { 
            margin: 0; font-family: 'Orbitron', sans-serif; 
            font-size: 32px; letter-spacing: 5px; text-shadow: 0 0 15px var(--active); 
        }
        
        #score-display { 
            color: var(--solved); font-size: 18px; margin-top: 10px; font-weight: bold;
            text-shadow: 0 0 10px var(--solved);
        }

        /* The Map Area & ESP32 Design */
        #map-container {
            position: relative;
            width: 100%; max-width: 900px; height: 1300px;
            margin: 140px auto 50px auto;
        }

        /* The ESP32 Chip Graphic built with CSS */
        .esp32-chip {
            position: absolute;
            top: 10%; left: 20%; right: 20%; bottom: 10%;
            background: var(--chip-bg);
            border: 4px solid #333;
            border-radius: 10px;
            box-shadow: inset 0 0 50px #000, 0 0 30px rgba(0,0,0,0.8);
            z-index: 0;
        }
        
        .esp32-antenna {
            position: absolute;
            top: 2%; left: 35%; right: 35%; height: 8%;
            background: repeating-linear-gradient( 45deg, transparent, transparent 10px, #bda25c 10px, #bda25c 20px );
            border: 2px solid #bda25c;
            z-index: 0;
        }

        /* SVG for drawing the connecting data traces */
        #data-traces {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1; pointer-events: none;
        }

        /* The Nodes */
        .node {
            position: absolute;
            width: 65px; height: 65px;
            background: var(--pcb-color);
            border: 3px solid var(--locked);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            display: flex; justify-content: center; align-items: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 22px; font-weight: 900; color: var(--locked);
            cursor: pointer; z-index: 10;
            box-shadow: 0 0 15px rgba(255, 0, 60, 0.4);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .node-label {
            position: absolute; top: 115%; width: 160px;
            text-align: center; font-size: 14px; font-weight: bold;
            background: rgba(0,0,0,0.8); padding: 4px; border-radius: 4px;
            pointer-events: none;
        }

        .node:hover { transform: translate(-50%, -50%) scale(1.15); }
        .node.locked { opacity: 0.5; cursor: not-allowed; border-color: #444; color: #444; box-shadow: none; }
        .node.locked .node-label { color: #555; }
        
        /* Active Node Pulse Animation */
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 243, 255, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(0, 243, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 243, 255, 0); }
        }

        .node.active { 
            border-color: var(--active); color: var(--active); 
            box-shadow: 0 0 20px var(--active);
            animation: pulse 2s infinite;
        }
        .node.active .node-label { color: var(--active); text-shadow: 0 0 5px var(--active); }

        .node.solved { 
            border-color: var(--solved); color: var(--solved); 
            box-shadow: 0 0 25px rgba(57, 255, 20, 0.6), inset 0 0 10px rgba(57, 255, 20, 0.4);
            background: rgba(57, 255, 20, 0.05);
        }
        .node.solved .node-label { color: var(--solved); }

        /* Terminal Modal */
        #terminal-modal {
            display: none; position: fixed;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 90%; max-width: 600px;
            background: rgba(5, 10, 25, 0.95); border: 2px solid var(--active);
            padding: 30px; z-index: 1000;
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.3);
            backdrop-filter: blur(5px);
        }

        #modal-overlay {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 999;
        }

        .term-header { 
            font-family: 'Orbitron', sans-serif; font-size: 22px; 
            margin-bottom: 20px; border-bottom: 1px dashed var(--active); padding-bottom: 10px; 
        }
        
        .term-input { 
            width: 100%; background: rgba(0,0,0,0.5); border: 1px solid #555;
            color: #fff; padding: 15px; font-family: 'Fira Code', monospace; font-size: 16px;
            box-sizing: border-box; margin-bottom: 20px; outline: none; transition: 0.3s;
        }
        .term-input:focus { border-color: var(--active); box-shadow: inset 0 0 10px rgba(0,243,255,0.2); }
        
        .btn {
            background: transparent; border: 2px solid var(--active); color: var(--active);
            padding: 10px 20px; cursor: pointer; font-family: 'Orbitron', sans-serif; font-weight: bold;
            font-size: 16px; transition: 0.2s; margin-right: 10px;
        }
        .btn:hover { background: var(--active); color: #000; box-shadow: 0 0 15px var(--active); }
        .btn.abort { border-color: var(--locked); color: var(--locked); }
        .btn.abort:hover { background: var(--locked); color: #000; box-shadow: 0 0 15px var(--locked); }
        
        #term-status { margin-top: 20px; height: 24px; font-weight: bold; font-size: 16px; }
        .err { color: var(--locked); text-shadow: 0 0 5px var(--locked); }
        .ok { color: var(--solved); text-shadow: 0 0 5px var(--solved); }
        .sys { color: #fff; }

    </style>
</head>
<body>

    <div id="header">
        <h1>IRON BIRD // C2 OVERRIDE</h1>
        <div id="score-display">SYSTEM COMPROMISE: <span id="score">0</span>%</div>
    </div>

    <div id="map-container">
        <div class="esp32-antenna"></div>
        <div class="esp32-chip"></div>
        
        <svg id="data-traces"></svg>
        </div>

    <div id="modal-overlay" onclick="closeModal()"></div>
    <div id="terminal-modal">
        <div class="term-header" id="modal-title">TARGET SECTOR</div>
        <p class="sys">> INJECT PAYLOAD HASH:</p>
        <input type="text" id="flag-input" class="term-input" placeholder="RebicaKick0ff{...}" autocomplete="off" spellcheck="false">
        <button class="btn" onclick="submitFlag()">[ EXECUTE ]</button>
        <button class="btn abort" onclick="closeModal()">[ ABORT ]</button>
        <div id="term-status"></div>
    </div>

    <script>
        // Updated with your exact SHA-256 Hashes
        const levels = [
            { id: 0, name: "Ghost Signal", hash: "af2392f2e2af88f99e438fe9019692ded2fb82bca97cc0bb72989e0d6d82c684", x: 20, y: 90 },
            { id: 1, name: "The Manifest", hash: "d8ee194d5a220576c8338d16d6bd4e79d93cd58d0c226a6526e492b9fad9fc5d", x: 80, y: 80 },
            { id: 2, name: "Default Creds", hash: "003d761cc512d4c97d21daf55b42bd3822a7351acac10be1ffba93362de26bd5", x: 80, y: 60 },
            { id: 3, name: "Dead Reckoning", hash: "16e58b8afc0078a35ff10133e24d7c8d3cd05c86a797401c0f45562560d0b762", x: 20, y: 50 },
            { id: 4, name: "Heartbleed Echo", hash: "ae894a02dc6ea6e30e7c8d44eb31b1a5d6aaea8e2df3dc61dbc617f73fdf8d92", x: 20, y: 30 },
            { id: 5, name: "Phantom Freq", hash: "400db21a612b6a3e7c78f38abc73ddd71a74007f4423ae77afef5215bc897c7c", x: 80, y: 20 },
            { id: 6, name: "SSRF Relay", hash: "6991fbe71ea2687b35bb47c6d65516d8f8371f810eda4431c47761a9db6f31a8", x: 50, y: 35 },
            { id: 7, name: "Kill Switch", hash: "5acd9ec1622ec0e82db2305fe1d3892a2a080551d2471d1bab1a49aa5bd90c02", x: 50, y: 5 }
        ];

        let activeNodeId = null;
        let solvedNodes = JSON.parse(localStorage.getItem('ironBirdProgress')) || [];

        function initMap() {
            const container = document.getElementById('map-container');
            const svg = document.getElementById('data-traces');
            
            // Clean up old nodes if re-initializing
            document.querySelectorAll('.node').forEach(e => e.remove());
            let svgContent = '';

            levels.forEach((lvl, index) => {
                let stateClass = 'locked';
                if (solvedNodes.includes(lvl.id)) stateClass = 'solved';
                else if (lvl.id === 0 || solvedNodes.includes(lvl.id - 1)) stateClass = 'active';

                const node = document.createElement('div');
                node.className = `node ${stateClass}`;
                node.id = `node-${lvl.id}`;
                node.style.left = `${lvl.x}%`;
                node.style.top = `${lvl.y}%`;
                node.innerText = `0${lvl.id}`;
                node.onclick = () => openModal(lvl.id);
                
                const label = document.createElement('div');
                label.className = 'node-label';
                label.innerText = `[ ${lvl.name.toUpperCase()} ]`;
                node.appendChild(label);

                container.appendChild(node);

                if (index > 0) {
                    const prev = levels[index - 1];
                    const isPathSolved = solvedNodes.includes(prev.id);
                    const strokeColor = isPathSolved ? '#39ff14' : '#ff003c';
                    const strokeWidth = isPathSolved ? 4 : 2;
                    const opacity = isPathSolved ? 0.8 : 0.3;
                    const dash = isPathSolved ? "" : 'stroke-dasharray="10,10"';
                    
                    svgContent += `
                        <line x1="${prev.x}%" y1="${prev.y}%" 
                              x2="${lvl.x}%" y2="${lvl.y}%" 
                              stroke="${strokeColor}" stroke-width="${strokeWidth}" 
                              opacity="${opacity}" ${dash} />
                        <circle cx="${lvl.x}%" cy="${lvl.y}%" r="4" fill="${strokeColor}" opacity="${opacity}" />
                    `;
                }
            });

            svg.innerHTML = svgContent;
            updateScore();
        }

        function updateScore() {
            const percentage = Math.floor((solvedNodes.length / levels.length) * 100);
            const scoreEl = document.getElementById('score');
            
            // Glitchy count up effect
            let current = 0;
            const interval = setInterval(() => {
                if (current >= percentage) {
                    scoreEl.innerText = percentage;
                    clearInterval(interval);
                } else {
                    current += Math.ceil((percentage - current) / 4) || 1;
                    scoreEl.innerText = current;
                }
            }, 30);

            if(percentage === 100) {
                setTimeout(() => { scoreEl.style.color = 'var(--solved)'; }, 500);
            }
        }

        function openModal(id) {
            const nodeEl = document.getElementById(`node-${id}`);
            if (nodeEl.classList.contains('locked')) return; 
            
            activeNodeId = id;
            document.getElementById('modal-title').innerText = `TARGET SECTOR // 0${id}: ${levels[id].name.toUpperCase()}`;
            document.getElementById('flag-input').value = '';
            document.getElementById('term-status').innerText = '';
            
            if (solvedNodes.includes(id)) {
                document.getElementById('term-status').innerHTML = '<span class="ok">> ROOT PRIVILEGES ALREADY ACQUIRED.</span>';
                document.getElementById('flag-input').disabled = true;
            } else {
                document.getElementById('flag-input').disabled = false;
            }

            document.getElementById('modal-overlay').style.display = 'block';
            document.getElementById('terminal-modal').style.display = 'block';
            document.getElementById('flag-input').focus();
        }

        function closeModal() {
            document.getElementById('modal-overlay').style.display = 'none';
            document.getElementById('terminal-modal').style.display = 'none';
            activeNodeId = null;
        }

        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function submitFlag() {
            if (activeNodeId === null || solvedNodes.includes(activeNodeId)) return;
            
            const input = document.getElementById('flag-input').value.trim();
            const status = document.getElementById('term-status');
            const targetHash = levels[activeNodeId].hash;
            
            status.innerHTML = '<span class="sys">> DECRYPTING PAYLOAD SIGNATURE...</span>';
            const inputHash = await sha256(input);

            setTimeout(() => {
                if (inputHash === targetHash) {
                    status.innerHTML = '<span class="ok">> ACCESS GRANTED. NODE COMPROMISED.</span>';
                    solvedNodes.push(activeNodeId);
                    localStorage.setItem('ironBirdProgress', JSON.stringify(solvedNodes));
                    
                    setTimeout(() => {
                        closeModal();
                        initMap(); // Redraw map to show unlocked path
                    }, 1200);
                } else {
                    status.innerHTML = '<span class="err">> ACCESS DENIED. KERNEL PANIC.</span>';
                    setTimeout(() => { status.innerHTML = ''; }, 2000);
                }
            }, 600); // Artificial delay for cinematic effect
        }

        document.getElementById('flag-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') submitFlag();
        });

        // Developer Tool: Type 'resetMap()' in the console to clear progress
        window.resetMap = function() {
            localStorage.removeItem('ironBirdProgress');
            solvedNodes = [];
            initMap();
            console.log("Map progress wiped.");
        }

        window.onload = initMap;
    </script>
</body>
</html>
