<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRON BIRD // C2 OVERRIDE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        
        body, html {
            margin: 0; padding: 0; height: 100%;
            background-color: #05050a;
            background-image: 
                linear-gradient(rgba(0, 255, 100, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 100, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            font-family: 'Share Tech Mono', monospace;
            color: #00ff66;
            overflow-x: hidden;
        }

        #header {
            text-align: center; padding: 20px;
            background: rgba(5, 5, 10, 0.9);
            border-bottom: 2px solid #00ff66;
            box-shadow: 0 0 15px rgba(0, 255, 100, 0.2);
            position: fixed; width: 100%; top: 0; z-index: 100;
        }

        h1 { margin: 0; font-size: 24px; letter-spacing: 4px; text-shadow: 0 0 10px #00ff66; }
        #score-display { color: #ff0055; font-size: 18px; margin-top: 5px; }

        /* The Map Area */
        #map-container {
            position: relative;
            width: 100%; max-width: 800px; height: 1200px;
            margin: 100px auto 50px auto;
        }

        /* SVG for drawing the connecting data traces */
        #data-traces {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1; pointer-events: none;
        }

        /* The Nodes (Islands) */
        .node {
            position: absolute;
            width: 60px; height: 60px;
            background: #0a0a15;
            border: 3px solid #ff0055;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            display: flex; justify-content: center; align-items: center;
            font-size: 20px; font-weight: bold; color: #ff0055;
            cursor: pointer; z-index: 10;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.5);
            transition: all 0.3s ease;
        }

        .node:hover { transform: translate(-50%, -50%) scale(1.1); }
        .node.locked { opacity: 0.4; cursor: not-allowed; border-color: #333; color: #333; box-shadow: none; }
        .node.solved { 
            border-color: #00ff66; color: #00ff66; 
            box-shadow: 0 0 20px rgba(0, 255, 100, 0.8), inset 0 0 10px rgba(0, 255, 100, 0.5);
            background: rgba(0, 255, 100, 0.1);
        }

        /* Modal / Terminal Window */
        #terminal-modal {
            display: none; position: fixed;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 90%; max-width: 500px;
            background: #05050a; border: 2px solid #00ff66;
            padding: 20px; z-index: 1000;
            box-shadow: 0 0 30px rgba(0, 255, 100, 0.2);
        }

        #modal-overlay {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 999;
        }

        .term-header { font-size: 18px; margin-bottom: 15px; border-bottom: 1px solid #00ff66; padding-bottom: 5px; }
        .term-input { 
            width: 100%; background: transparent; border: 1px solid #333;
            color: #fff; padding: 10px; font-family: 'Share Tech Mono', monospace;
            box-sizing: border-box; margin-bottom: 15px; outline: none;
        }
        .term-input:focus { border-color: #00ff66; }
        
        .btn {
            background: transparent; border: 1px solid #00ff66; color: #00ff66;
            padding: 8px 15px; cursor: pointer; font-family: 'Share Tech Mono', monospace;
            transition: 0.2s;
        }
        .btn:hover { background: #00ff66; color: #000; }
        #term-status { margin-top: 10px; height: 20px; font-weight: bold; }
        .err { color: #ff0055; }
        .ok { color: #00ff66; }

    </style>
</head>
<body>

    <div id="header">
        <h1>IRON BIRD // C2 OVERRIDE</h1>
        <div id="score-display">SYSTEM COMPROMISE: <span id="score">0</span>%</div>
    </div>

    <div id="map-container">
        <svg id="data-traces"></svg>
        </div>

    <div id="modal-overlay" onclick="closeModal()"></div>
    <div id="terminal-modal">
        <div class="term-header" id="modal-title">TARGET NODE</div>
        <p>Inject Flag Payload:</p>
        <input type="text" id="flag-input" class="term-input" placeholder="RebicaKick0ff{...}" autocomplete="off">
        <button class="btn" onclick="submitFlag()">EXECUTE</button>
        <button class="btn" onclick="closeModal()" style="border-color:#ff0055; color:#ff0055;">ABORT</button>
        <div id="term-status"></div>
    </div>

    <script>
        // The Winding Map Coordinates (X%, Y%) - Bottom to Top progression
        const levels = [
            { id: 0, name: "Ghost Signal", x: 20, y: 95, hash: "9516ca4d0b4353b3d4f5b5b0451eeb226d40578b9b46f522f180f6da86f3dbd9" },
            { id: 1, name: "The Manifest", x: 70, y: 85, hash: "9212c1b2f0c76ca4a2cd3ec44dcf49b389edfc0b9c3f50dd707b6100ca4164b7" },
            { id: 2, name: "Default Creds", x: 30, y: 70, hash: "04746618e7d23d91cf9fdbfcfc141d8e1329aee5e970b5b2db0a8e1abecbfb4d" },
            { id: 3, name: "Dead Reckoning", x: 80, y: 55, hash: "64344eab8ab664ef55e16b9b392a11b61cbb27a85871324707834fc09d4375ff" },
            { id: 4, name: "Heartbleed Echo", x: 20, y: 40, hash: "f3c2b8c5a4b494d4559591e0a2fde69d7240c5b36bbdc37bdf3da416a9a7a6c9" },
            { id: 5, name: "Phantom Freq", x: 60, y: 25, hash: "18ff3eb7d8ebce54805e608f02f9048c21966a01dd3a62376dc86214edc4ebf1" },
            { id: 6, name: "SSRF Relay", x: 30, y: 12, hash: "c3e982ecdd029a1e0410ebcfffa2abcc1ad30303e040f3408a0d7d7b140640f0" },
            { id: 7, name: "Kill Switch", x: 50, y: 2, hash: "b5c1f0d3b6f2022d1921c32085ce3be293f0b064c2d43e5c94d0c1e879a834e5" }
        ];

        let activeNodeId = null;
        let solvedNodes = JSON.parse(localStorage.getItem('ironBirdProgress')) || [];

        function initMap() {
            const container = document.getElementById('map-container');
            const svg = document.getElementById('data-traces');
            let svgContent = '';

            levels.forEach((lvl, index) => {
                // Determine node state
                let stateClass = 'locked';
                if (solvedNodes.includes(lvl.id)) stateClass = 'solved';
                else if (lvl.id === 0 || solvedNodes.includes(lvl.id - 1)) stateClass = 'active';

                // Create HTML Node
                const node = document.createElement('div');
                node.className = `node ${stateClass}`;
                node.id = `node-${lvl.id}`;
                node.style.left = `${lvl.x}%`;
                node.style.top = `${lvl.y}%`;
                node.innerText = lvl.id;
                node.onclick = () => openModal(lvl.id);
                
                // Add label
                const label = document.createElement('div');
                label.style.position = 'absolute';
                label.style.top = '110%';
                label.style.width = '120px';
                label.style.textAlign = 'center';
                label.style.fontSize = '12px';
                label.innerText = `LVL ${lvl.id}: ${lvl.name}`;
                node.appendChild(label);

                container.appendChild(node);

                // Draw SVG Path to previous node
                if (index > 0) {
                    const prev = levels[index - 1];
                    const strokeColor = solvedNodes.includes(prev.id) ? '#00ff66' : '#333';
                    const strokeWidth = solvedNodes.includes(prev.id) ? 3 : 1;
                    
                    svgContent += `
                        <line x1="${prev.x}%" y1="${prev.y}%" 
                              x2="${lvl.x}%" y2="${lvl.y}%" 
                              stroke="${strokeColor}" stroke-width="${strokeWidth}" 
                              stroke-dasharray="5,5" />
                    `;
                }
            });

            svg.innerHTML = svgContent;
            updateScore();
        }

        function updateScore() {
            const percentage = Math.floor((solvedNodes.length / levels.length) * 100);
            document.getElementById('score').innerText = percentage;
            if(percentage === 100) {
                document.getElementById('score').style.color = '#00ff66';
            }
        }

        function openModal(id) {
            const nodeEl = document.getElementById(`node-${id}`);
            if (nodeEl.classList.contains('locked')) return; // Cannot open locked nodes
            
            activeNodeId = id;
            document.getElementById('modal-title').innerText = `TARGET NODE // LVL ${id}: ${levels[id].name.toUpperCase()}`;
            document.getElementById('flag-input').value = '';
            document.getElementById('term-status').innerText = '';
            
            if (solvedNodes.includes(id)) {
                document.getElementById('term-status').innerHTML = '<span class="ok">AUTHORIZATION ALREADY GRANTED.</span>';
                document.getElementById('flag-input').disabled = true;
            } else {
                document.getElementById('flag-input').disabled = false;
            }

            document.getElementById('modal-overlay').style.display = 'block';
            document.getElementById('terminal-modal').style.display = 'block';
            document.getElementById('flag-input').focus();
        }

        function closeModal() {
            document.getElementById('modal-overlay').style.display = 'none';
            document.getElementById('terminal-modal').style.display = 'none';
            activeNodeId = null;
        }

        // SHA-256 Hashing for offline verification
        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function submitFlag() {
            if (activeNodeId === null || solvedNodes.includes(activeNodeId)) return;
            
            const input = document.getElementById('flag-input').value.trim();
            const status = document.getElementById('term-status');
            const targetHash = levels[activeNodeId].hash;
            
            status.innerHTML = '<span style="color:#fff;">VERIFYING PAYLOAD...</span>';
            const inputHash = await sha256(input);

            if (inputHash === targetHash) {
                status.innerHTML = '<span class="ok">PAYLOAD ACCEPTED. LINK ESTABLISHED.</span>';
                solvedNodes.push(activeNodeId);
                localStorage.setItem('ironBirdProgress', JSON.stringify(solvedNodes));
                
                setTimeout(() => {
                    closeModal();
                    // Full re-render to update the map visual state
                    document.getElementById('map-container').innerHTML = '<svg id="data-traces"></svg>';
                    initMap();
                }, 1500);
            } else {
                status.innerHTML = '<span class="err">FATAL: SIGNATURE MISMATCH.</span>';
                setTimeout(() => { status.innerHTML = ''; }, 2000);
            }
        }

        // Allow 'Enter' key submission
        document.getElementById('flag-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') submitFlag();
        });

        // Initialize Map on Load
        window.onload = initMap;
    </script>
</body>
</html>
